<h2 mat-dialog-title>Add New Detail</h2>
<mat-dialog-content>
  <form [formGroup]="detailForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" required>
      <mat-error *ngIf="detailForm.get('name')?.hasError('required')">
        Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Price</mat-label>
      <input matInput type="number" step="0.01" formControlName="price" required>
      <mat-error *ngIf="detailForm.get('price')?.hasError('required')">
        Price is required
      </mat-error>
      <mat-error *ngIf="detailForm.get('price')?.hasError('min')">
        Price must be positive
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Quantity</mat-label>
      <input matInput type="number" formControlName="quantity" required>
      <mat-error *ngIf="detailForm.get('quantity')?.hasError('required')">
        Quantity is required
      </mat-error>
      <mat-error *ngIf="detailForm.get('quantity')?.hasError('min')">
        Quantity must be positive
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="detailForm.invalid">
    Create
  </button>
</mat-dialog-actions>
